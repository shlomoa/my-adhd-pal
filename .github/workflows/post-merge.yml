name: Post-merge script tests

# The slow lane test scripts (negative fixtures, fresh-clone formatter check, spike runners, Gradle based checks) take
# more than 15 minutes, so they run after each merge to main instead of on every pull request (issue 190).
# A failure opens or updates one issue labelled main-red; a later green run closes it.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  script-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Script tests
        id: tests
        continue-on-error: true
        run: scripts/post-merge-tests.sh

      - name: Open, update or close the main-red issue
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          state=green
          [ "${{ steps.tests.outcome }}" = success ] || state=red
          scripts/main-red-issue.sh "$state" build/post-merge/report.md "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: script-test-logs
          path: build/post-merge/

      - name: Fail the run when a script test failed
        if: ${{ steps.tests.outcome != 'success' && !cancelled() }}
        run: exit 1
