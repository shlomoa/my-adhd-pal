name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Check and build
        run: ./gradlew check assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: apks-debug
          path: |
            wear/build/outputs/apk/debug/*.apk
            phone/build/outputs/apk/debug/*.apk

  # The documentation site (mkdocs.yml) is built in strict mode; the result is not published.
  docs-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Every document is linked from docs/index.md
        run: scripts/check-docs-index.sh

      - name: Build the documentation site (strict)
        run: scripts/docs-site.sh
