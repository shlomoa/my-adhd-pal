name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Check and build
        run: ./gradlew check assembleDebug

      # Needs the debug and release APKs that the step above built.
      - name: Debug code stays out of release builds
        run: wear/src/test/scripts/test-debug-separation.sh

      - uses: actions/upload-artifact@v4
        with:
          name: apks-debug
          path: |
            wear/build/outputs/apk/debug/*.apk
            phone/build/outputs/apk/debug/*.apk

  # External URLs can fail for reasons outside this repo, so this job never blocks a pull request.
  external-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Check external links
        id: external
        continue-on-error: true
        run: ./gradlew checkExternalLinks

      - name: Warn about broken external links
        if: steps.external.outcome == 'failure'
        run: echo "::warning::Some external links in the docs are broken or unreachable (see the Check external links step). This does not block the pull request."

  # The documentation site (mkdocs.yml, issue #156) is built in strict mode; the result is not published.
  docs-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Every document is linked from docs/index.md
        run: scripts/check-docs-index.sh

      - name: Build the documentation site (strict)
        run: scripts/docs-site.sh
