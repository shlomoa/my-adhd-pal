<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ADHD Pal: overview</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ui.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width: 1200px; height: 640px; padding: 30px 32px; display: flex; flex-direction: column; gap: 14px; background: radial-gradient(ellipse 60% 70% at 0% 0%, rgba(0,214,196,.28), transparent 70%), radial-gradient(ellipse 60% 70% at 100% 100%, rgba(138,77,255,.32), transparent 70%), var(--bg)">
<div style="display: flex; align-items: baseline; gap: 18px">
<h1 style="font-size: 34px; font-weight: 800">ADHD Pal: screen designs</h1>
<p class="t2" style="font-size: 16px">Proposed design in the aurora style: 13 phone screens and 9 watch screens.</p>
</div>
<p class="sec-h" style="padding-top: 0">Phone app</p>
<div style="display: flex; gap: 10px; align-items: flex-start">
<figure style="margin: 0; width: 80px"><img src="../images/P1-watch-tab.png" alt="P1 Watch tab" style="width: 80px; display: block; border-radius: 8px"><figcaption class="cap" style="text-align: center">P1</figcaption></figure>
<figure style="margin: 0; width: 80px"><img src="../images/P2-tasks.png" alt="P2 Tasks" style="width: 80px; display: block; border-radius: 8px"><figcaption class="cap" style="text-align: center">P2</figcaption></figure>
<figure style="margin: 0; width: 80px"><img src="../images/P3-task-edit.png" alt="P3 Task edit" style="width: 80px; display: block; border-radius: 8px"><figcaption class="cap" style="text-align: center">P3</figcaption></figure>
<figure style="margin: 0; width: 80px"><img src="../images/P4-reminder-edit.png" alt="P4 Reminder edit" style="width: 80px; display: block; border-radius: 8px"><figcaption class="cap" style="text-align: center">P4</figcaption></figure>
<figure style="margin: 0; width: 80px"><img src="../images/P5-schedule.png" alt="P5 Schedule" style="width: 80px; display: block; border-radius: 8px"><figcaption class="cap" style="text-align: center">P5</figcaption></figure>
<figure style="margin: 0; width: 80px"><img src="../images/P6-history.png" alt="P6 History" style="width: 80px; display: block; border-radius: 8px"><figcaption class="cap" style="text-align: center">P6</figcaption></figure>
<figure style="margin: 0; width: 80px"><img src="../images/P7-settings.png" alt="P7 Settings" style="width: 80px; display: block; border-radius: 8px"><figcaption class="cap" style="text-align: center">P7</figcaption></figure>
<figure style="margin: 0; width: 80px"><img src="../images/P8-ask-your-watch.png" alt="P8 Ask your watch" style="width: 80px; display: block; border-radius: 8px"><figcaption class="cap" style="text-align: center">P8</figcaption></figure>
<figure style="margin: 0; width: 80px"><img src="../images/P9-allow-heart-rate.png" alt="P9 Allow heart rate" style="width: 80px; display: block; border-radius: 8px"><figcaption class="cap" style="text-align: center">P9</figcaption></figure>
<figure style="margin: 0; width: 80px"><img src="../images/P10-alert-level-1.png" alt="P10 Phone alert level 1" style="width: 80px; display: block; border-radius: 8px"><figcaption class="cap" style="text-align: center">P10</figcaption></figure>

<figure style="margin: 0; width: 118px"><img src="../images/W5-tile.png" alt="W5 Tile" style="width: 118px; display: block"><figcaption class="cap" style="text-align: center">W5</figcaption></figure>

<figure style="margin: 0; width: 118px"><img src="../images/W9-allow-heart-rate.png" alt="W9 Allow heart rate" style="width: 118px; display: block"><figcaption class="cap" style="text-align: center">W9</figcaption></figure>
</div>
</div>
</x-dc>
