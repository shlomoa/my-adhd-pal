<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tasks tab</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ui.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>body{margin:0}</style>
</helmet>
<div class="ph rel">
<div class="bar"><h1>Tasks</h1></div>
<div class="body">
<div class="card"><div class="row"><div class="grow"><p class="t1">Take the pills</p><p class="t2">Every day, 08:00</p></div><button type="button" class="ib" aria-label="Delete Take the pills" style="background:#F3F6F9"><i class="ic i-trash" aria-hidden="true"></i></button></div></div>
<div class="card"><div class="row"><div class="grow"><p class="t1">Start the report</p><p class="t2">Mon to Fri, 10:00 and 14:00</p></div><button type="button" class="ib" aria-label="Delete Start the report" style="background:#F3F6F9"><i class="ic i-trash" aria-hidden="true"></i></button></div></div>
<div class="card"><div class="row"><div class="grow"><p class="t1">Water the plants</p><p class="t2">Sun, 18:00</p></div><button type="button" class="ib" aria-label="Delete Water the plants" style="background:#F3F6F9"><i class="ic i-trash" aria-hidden="true"></i></button></div></div>
<div style="flex: 1"></div>
<button type="button" class="btn out" style="width: 100%">Review schedule for the watch</button>
</div>
<button type="button" class="btn pri fab" style="min-height: 56px; padding: 0 24px"><i class="ic i-plus" aria-hidden="true"></i>Add a task</button>
<div class="nav">
<button type="button"><i class="ic i-watch" aria-hidden="true"></i>Watch</button>
<button type="button" class="on"><i class="ic i-tasks" aria-hidden="true"></i>Tasks</button>
<button type="button"><i class="ic i-history" aria-hidden="true"></i>History</button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
