<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Phone alert level 1</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ui.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>body{margin:0}</style>
</helmet>
<div class="ph" style="background: #FFE3B8; align-items: center; justify-content: center; text-align: center; padding: 40px 28px; gap: 20px; color: #2B1700">
<i class="ic i-heart" aria-hidden="true" style="width: 64px; height: 64px"></i>
<h1 style="font-size: 36px; font-weight: 700; line-height: 1.1">Your heart rate is high</h1>
<p class="big" style="font-size: 72px">118</p>
<p style="font-size: 20px">bpm. Your alert is at 92.</p>
<div style="width: 160px; height: 160px; border-radius: 50%; border: 10px solid #2B1700; display: grid; place-items: center; font-size: 22px; font-weight: 700; margin: 8px 0">Breathe</div>
<p style="font-size: 20px">Breathe in slowly. Breathe out slower.</p>
<button type="button" class="btn" style="width: 100%; min-height: 64px; font-size: 22px; background: #2B1700; color: #FFE3B8">I'm OK</button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>

  renderVals() { return {}; }
}
</script>
</body>
</html>
